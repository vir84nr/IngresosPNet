    <script>
  
const usuarios = {
    "Reconquista": "Recon1234",
    "Polo": "Polo1234",
    "Calderon": "Cal1234"
};

function login() {
    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;

    if (usuarios[user] && usuarios[user] === pass) {
        localStorage.setItem("usuarioLogueado", user);

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";

        cargarDatos();
    } else {
        alert("Usuario o contraseña incorrectos");
    }
}


        /*document.addEventListener("DOMContentLoaded", cargarDatos);*/

        document.addEventListener("DOMContentLoaded", () => {
    let user = localStorage.getItem("usuarioLogueado");

    if (user) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
        cargarDatos();
    }
});

        function guardarDato() {
            let usuario = document.getElementById("dato1").value.trim();
            let fecha = document.getElementById("dato2").value.trim();
            let edificio = document.getElementById("dato3").value;
            let puesto = document.getElementById("dato4").value;
            let equipoEntregado = document.getElementById("equipoEntregado").value.trim();

            if (!usuario || !fecha || !edificio || !puesto) {
                alert("Faltan completar campos.");
                return;
            }

            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            datos.push({ dato1: usuario, dato2: fecha, dato3: edificio, dato4: puesto, equipoEntregado });
            localStorage.setItem("datos", JSON.stringify(datos));

            document.getElementById("dato1").value = "";
            document.getElementById("dato2").value = "";
            document.getElementById("dato3").selectedIndex = 0;
            document.getElementById("dato4").selectedIndex = 0;
            document.getElementById("equipoEntregado").value = "";

            cargarDatos();
        }

        function cargarDatos() {
            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            mostrarDatos(datos);
        }

        function mostrarDatos(datos) {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    datos.forEach((item, index) => {
        let fechaFormateada = "Fecha no válida";
        if (item.dato2) {
            let partes = item.dato2.split("-");
            if (partes.length === 3) {
                let [año, mes, dia] = partes;
                fechaFormateada = `${dia.padStart(2, "0")}-${mes.padStart(2, "0")}-${año}`;
            }
        }

        let li = document.createElement("li");
        li.classList.add("list-group-item");

        li.innerHTML = `
            <div class="container">
                <div class="row">
                    <div class="col-12 col-md-6">
                        <p><strong>Ingreso:</strong> <span contenteditable="true" class="editable resaltado2" data-id="${index}" data-field="dato2">${fechaFormateada}</span></p>
                        <p><strong>Usuario:</strong> <span contenteditable="true" class="editable resaltado3" data-id="${index}" data-field="dato1">${item.dato1}</span></p>
                        <p><strong>Edificio:</strong> <span contenteditable="true" class="editable" data-id="${index}" data-field="dato3">${item.dato3}</span></p>
                        <p><strong>Puesto:</strong> <span contenteditable="true" class="editable" data-id="${index}" data-field="dato4">${item.dato4}</span></p>
                        <p><strong>Equipo Entregado:</strong> <span contenteditable="true" class="editable resaltado" data-id="${index}" data-field="equipoEntregado">${item.equipoEntregado || 'Cargar modelo y serie'}</span></p>
                    </div>
<div class="col-12 col-md-2 d-flex flex-column ms-auto">
    <button class="btn btn-danger btn-sm w-100 w-md-auto mb-2" onclick="eliminarDato(${index})">Eliminar</button>
    <button class="btn btn-info btn-sm w-100 w-md-auto mb-2" onclick="generarNota(${index})">Generar Nota</button>
</div>
                </div>
            </div>
        `;

        lista.appendChild(li);
    });

    // Permitir edición y guardar cambios automáticamente
    document.querySelectorAll('.editable').forEach(element => {
        element.addEventListener('blur', (event) => {
            let index = event.target.dataset.id;
            let field = event.target.dataset.field;
            let value = event.target.innerText.trim();

            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            if (datos[index]) {
                datos[index][field] = value;
                localStorage.setItem("datos", JSON.stringify(datos));
            }
        });
    });
}


        function eliminarDato(index) {
            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            datos.splice(index, 1);
            localStorage.setItem("datos", JSON.stringify(datos));
            cargarDatos();
        }

        function filtrarDatos() {
            let fechaFiltro = document.getElementById("filtroFecha").value;
            let edificioFiltro = document.getElementById("filtroEdificio").value;
            let puestoFiltro = document.getElementById("filtroPuesto").value;
            let equipoFiltro = document.getElementById("filtroEquipo").value;

            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            let filtrados = datos.filter(item =>
                (fechaFiltro === "" || item.dato2 === fechaFiltro) &&
                (edificioFiltro === "" || item.dato3 === edificioFiltro) &&
                (puestoFiltro === "" || item.dato4 === puestoFiltro) &&
                (equipoFiltro === "" || (equipoFiltro === 'true' && item.equipoEntregado !== "") || (equipoFiltro === 'false' && item.equipoEntregado === ""))
            );

            mostrarDatos(filtrados);
        }
        
        function descargarExcel() {
    let datos = JSON.parse(localStorage.getItem("datos")) || [];
    if (datos.length === 0) {
        alert("No hay datos para exportar.");
        return;
    }

    // Renombrar las claves de los datos para mejorar los encabezados del archivo Excel
    let datosModificados = datos.map((item, index) => ({
        "ID": index + 1,
        "Usuario": item.dato1,
        "Fecha de Ingreso": item.dato2,
        "Edificio": item.dato3,
        "Puesto": item.dato4
    }));

    // Crear la hoja de cálculo con los nuevos encabezados
    let ws = XLSX.utils.json_to_sheet(datosModificados);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Datos");

    // Descargar el archivo Excel
    XLSX.writeFile(wb, "LISTADO-de-INGRESOS.xlsx");
}

  

        async function generarNota(index) {
            let datos = JSON.parse(localStorage.getItem("datos")) || [];
            let usuario = datos[index].dato1;
            let equipo = datos[index].equipoEntregado || "No especificado";

            console.log("Generando nota para:", usuario, "con equipo:", equipo);

            try {
                // 1. Cargar la plantilla
                let response = await fetch("https://dl.dropboxusercontent.com/scl/fi/ycuw0lqxd7pdwaifzki1r/plantilla.docx?rlkey=9hxcmam06ev63mv255d5lan5s");
                if (!response.ok) {
                    throw new Error("No se pudo cargar la plantilla. Verifica la ruta y el archivo.");
                }
                let arrayBuffer = await response.arrayBuffer();
                console.log("Plantilla cargada correctamente.");

                // 2. Procesar la plantilla con docxtemplater
                let zip = new PizZip(arrayBuffer);
                let doc;
                try {
                    doc = new docxtemplater().loadZip(zip);
                } catch (error) {
                    console.error("Error al cargar el archivo ZIP:", error);
                    return;
                }

                // 3. Reemplazar placeholders con los datos
                doc.setData({
                    nombre: usuario,
                    equipo: equipo
                });

                try {
                    doc.render(); // Renderizar el documento
                    console.log("Documento renderizado correctamente.");
                } catch (error) {
                    console.error("Error al renderizar el documento:", error);
                    console.error("Detalles:", {
                        message: error.message,
                        name: error.name,
                        stack: error.stack,
                        properties: error.properties
                    });
                    return;
                }

                // 4. Generar el archivo Word
                let blob = doc.getZip().generate({ type: "blob" });
                saveAs(blob, `Nota_Entrega_${usuario}.docx`);
                console.log("Nota generada y descargada correctamente.");
            } catch (error) {
                console.error("Error al generar la nota:", error);
            }
        }
        

     function logout() {
    localStorage.removeItem("usuarioLogueado");
